<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <title>Painel | P2 Automações</title>
  <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/painel/app/css/admin.css">
  <script type="module" src="/painel/app/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu do painel">
      <div class="sidebar-brand">
        <img src="/img/mark.svg" alt="" width="32" height="32">
        <span><strong>P2</strong> Painel</span>
      </div>

      <nav aria-label="Seções do painel">
        <ul class="menu">
          <li><a href="#/visao-geral" data-route="visao-geral">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z"/></svg>
            Visão geral</a></li>
          <li><a href="#/clientes" data-route="clientes">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.7.7 3 2.2 3 4.7"/></svg>
            Clientes</a></li>
          <li><a href="#/projetos" data-route="projetos">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8A1.5 1.5 0 0 1 20.5 10v8A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/></svg>
            Projetos</a></li>
          <li><a href="#/vendas" data-route="vendas">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-5 4 3 7-8M15 8h5v5"/></svg>
            Vendas</a></li>
          <li><a href="#/financeiro" data-route="financeiro">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16.5 14.5h.01"/></svg>
            Financeiro</a></li>
          <li><a href="#/tarefas" data-route="tarefas">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8.5 12.2l2.5 2.5 4.5-5"/></svg>
            Tarefas</a></li>
          <li><a href="#/contatos" data-route="contatos">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-7.5h11L20 13M4 13v5a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-5M4 13h4.5l1 2h5l1-2H20"/></svg>
            Contatos do site <span class="menu-count" id="leads-count" hidden></span></a></li>
          <li><a href="#/configuracoes" data-route="configuracoes">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
            Configurações</a></li>
        </ul>
      </nav>

      <div class="sidebar-user">
        <p class="user-name" id="user-name">…</p>
        <p class="user-role" id="user-role"></p>
        <button class="btn btn--sidebar" type="button" id="logout">Sair</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="content">
      <header class="topbar">
        <button class="menu-toggle" type="button" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">
          <span class="sr-only">Abrir menu</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="page-title">Painel</h1>
        <p class="topbar-date" id="today"></p>
      </header>

      <div class="banner" id="demo-banner" hidden>
        <p><strong>Dados demonstrativos.</strong> Os registros com o selo <span class="badge badge--demo">Demo</span> são exemplos e não representam a empresa.</p>
        <a class="banner-link" href="#/configuracoes">Gerenciar</a>
      </div>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
