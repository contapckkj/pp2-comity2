<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <title>Acesso restrito | P2 Automações</title>
  <link rel="icon" href="/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/painel/login/login.css">
  <script src="/painel/login/login.js" defer></script>
</head>
<body>
  <main class="login">
    <div class="login-brand">
      <img src="/img/mark.svg" alt="" width="40" height="40">
      <span><strong>P2</strong> Automações</span>
    </div>

    <form class="login-card" id="login-form" novalidate>
      <h1>Acesso restrito</h1>
      <p class="intro">Área exclusiva para a diretoria. Entre com o seu e-mail e a sua senha.</p>

      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="reveal" aria-pressed="false" aria-controls="password">Mostrar</button>
        </div>
      </div>

      <p class="error" id="login-error" role="alert"></p>

      <button class="submit" type="submit">Entrar</button>
    </form>

    <p class="back"><a href="/">Voltar ao site</a></p>
  </main>
</body>
</html>
